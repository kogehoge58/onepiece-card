<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MerryDesk</title>
  <link rel="icon" type="image/png" sizes="32x32" href="component_images/icon.png">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;           /* 画面本体はスクロール禁止 */
      font-family: sans-serif;
      /* background: url("component_images/wallpaper.png") center center / cover no-repeat; */
    }

    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;  /* 画面全体をカバー */
      z-index: -1;        /* コンテンツの背面へ */
    }

    .container { display: flex; width: 100%; height: 100%; }
    .player-field {
      flex: 1; padding: 30px;
      display: flex; flex-direction: column;
    }

    .card-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, auto); /* 各行の高さ＝カード実寸 */
      gap: 5px;
      align-content: center;               /* 余白は上下に逃がす（行間に入れない） */
    }

    .card {
      width: 100%; aspect-ratio: 1 / 1.4;
      border: 2px solid #333; display: flex; justify-content: center; align-items: center;
      font-size: 0.7vw; font-weight: bold; position: relative; overflow: hidden;
      background-color: rgba(255, 255, 255, 0.4);
    }
    .card img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }

    /* 共通ラベル（左下） */
    .card .deck-label,
    .card .life-label,
    .card .hand-label,
    .card .trash-label,
    .card .don-label,
    .card .menu-label {
      position: absolute;
      left: 6px; bottom: 6px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.6);
      color: #fff; font-weight: 700;
      font-size: clamp(10px, 0.9vw, 12px);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    /* ===== モーダル ===== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none;              /* 初期は非表示 */
      align-items: center; justify-content: center; z-index: 9999;
    }
    .modal {
      --thumb-w: 140px;   /* ★サムネ1枚の幅（必要なら調整） */
      --thumb-gap: 10px;  /* サムネの間隔 */
      background: #fff; max-width: 90vw; max-height: 90vh;
      width: auto;                 /* ★内容幅に合わせて狭める */
      height: 90vh;                /* 既存どおり縦は固定 */
      border-radius: 10px; padding: 16px;
      display: flex; flex-direction: column;
    }
    .thumbs {
      /* 既存 */
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(5, var(--thumb-w));
      gap: var(--thumb-gap);
      width: calc(5 * var(--thumb-w) + 4 * var(--thumb-gap));

      /* ★追加/置き換え */
      scrollbar-gutter: stable;      /* 対応ブラウザで縦スクロール分の溝を常時確保 */
      box-sizing: content-box;       /* 下のパディングで内容幅を削らないように */
      padding-inline-end: 20px;      /* 非対応ブラウザ向けのフォールバック余白 */
    }
    .thumbs img {
      width: 100%; aspect-ratio: 1 / 1.4; object-fit: cover; border: 1px solid #aaa;
    }

    /* ==== DECK用コンテキストメニュー ==== */
    .context-menu{
      position: fixed;
      display: none;
      min-width: 160px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 10px;
      padding: 6px 0;
      z-index: 10000;
      box-shadow: 0 10px 24px rgba(0,0,0,.3);
      backdrop-filter: blur(2px);
    }
    .context-menu button{
      all: unset;
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .context-menu button:hover{
      background: rgba(255,255,255,0.12);
    }

    /* 画像プレビュー用（中央拡大） */
    #preview-backdrop { z-index: 10001; } /* ギャラリーより前に出す */

    /* レスト表示用：薄い黒マスク＋右上バッジ */
    .rest-overlay{
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.35);
      pointer-events: none;
      /* z-index: 1; */
    }
    .rest-badge{
      position: absolute;
      left: 6px;
      bottom: 30px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.6);
      color: #fff; font-weight: 700;
      font-size: clamp(10px, 0.9vw, 12px);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    /* ステージ上のレスト表記は左下（ドン×nと同位置）に固定 */
    #a-stage .rest-badge,
    #b-stage .rest-badge { left: 6px; bottom: 6px; }

    /* ルールPDFモーダルはメニューより前面に出す */
    #rules-backdrop { z-index: 10001; }

    /* ★一覧ダイアログのヘッダー */
    .modal-header{
      flex: 0 0 auto;
      padding: 6px 8px 10px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 10px;
    }
    .modal-title{
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: .08em;
    }

    /* サムネ1枚のラッパ & 右上の「裏向き」ボタン */
    .thumbs .thumb-wrap { position: relative; width: 100%; }
    .thumbs .thumb-flip{
      position: absolute; top: 4px; right: 4px;
      padding: 6px 10px; border-radius: 8px; border: 0;
      background: rgba(0,0,0,.6); color: #fff; font-weight: 700;
      font-size: clamp(12px, 1.1vw, 16px); line-height: 1;
      cursor: pointer; user-select: none;
    }

    .modal-header{ position: relative; display:flex; align-items:center; justify-content:center; }
    .header-btn{
      position:absolute; right:8px; top:6px;
      padding:6px 10px; border-radius:8px; border:0;
      background:rgba(0,0,0,.6); color:#fff; font-weight:700;
      font-size:clamp(12px,1.1vw,16px); line-height:1; cursor:pointer;
    }

    /* 文字のドラッグ選択を全体で無効化（入力系は除外） */
    *:not(input):not(textarea){
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* 画像のドラッグ（半透明ゴースト）を無効化 */
    img{
      -webkit-user-drag: none;
    }

    /* 既存: .thumbs .thumb-flip と同等の見た目で */
    .thumbs .thumb-deckbtn{
      position: absolute;
      top: 4px; right: 4px;
      padding: 6px 10px; border-radius: 8px; border: 0;
      background: rgba(0,0,0,.6); color: #fff; font-weight: 700;
      font-size: clamp(12px, 1.1vw, 16px); line-height: 1;
      cursor: pointer; user-select: none;
    }

    /* --- ドンデッキ中央アラート（安全余白の中央に配置） --- */
    .card.don-deck{
      --safe-top: 12px;
      --safe-bottom: 34px;

      /* 安全領域（= 100% - (top + bottom)）の中央Y座標 */
      --alert-center: calc( var(--safe-top) + (100% - (var(--safe-top) + var(--safe-bottom))) / 2 );
    }

    /* 中央に重ねるアラート画像。安全余白を差し引いた最大高さで自動調整 */
    .card.don-deck .alert-icon{
      position: absolute;
      left: 50%;
      top: var(--alert-center);         /* ← 以前の top:50% を安全領域の中心に */
      transform: translate(-50%, -50%); /* 画像の中心をその座標に合わせる */

      /* 横幅はカード幅の最大40%か140pxの小さい方（既存のまま） */
      max-width: min(40%, 140px);

      /* 高さは安全領域いっぱい（既存のまま） */
      max-height: calc(100% - (var(--safe-top) + var(--safe-bottom)));
      width: auto;
      height: auto;
      pointer-events: none;
      z-index: 1;
      opacity: 0.95;
    }

    /* === ターン中ハイライト === */
    .player-field.turn-active .card{
      border-color: #39FF14; /* 蛍光グリーン */
    }

    /* 攻撃不可アイコン（キャラカード右下・小さめ） */
    .card .no-attack-icon{
      position: absolute;
      right: 6px;
      bottom: 6px;
      max-width: min(26%, 56px); /* 小さく表示 */
      width: auto;
      height: auto;
      pointer-events: none; /* クリック透過 */
      z-index: 2;           /* ラベルより上 */
    }

    /* デッキ選択（2カラムの一覧） */
    #deckselect-backdrop { z-index: 10001; }  /* メニューより前面（既存ルールPDFと同様） */
    .deckselect-modal { width: min(900px, 90vw); height: min(80vh, 90vh); }

    .deckselect-list{
      flex: 1; overflow: auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      padding-inline-end: 20px; /* スクロールバー溝の調整は既存モーダルと同様 */
    }
    .deckselect-item{
      display: flex; align-items: center; gap: 16px;
      border: 1px solid #bbb; border-radius: 8px;
      padding: 20px 16px;                /* 余白も少し増量 */
      min-height: 100px;                 /* ★縦幅：およそ倍に */
      background: #fff;
      position: relative; overflow: hidden; /* 背景グラデ維持 */
    }
    .deckselect-item img{
      width: 80px; height: 80px;       /* ★画像サイズも倍に */
      object-fit: cover;
      border: 1px solid #aaa;
    }
    .deckselect-name{ flex: 1; font-weight: 700; }

    /* ボタンの見た目は「裏向き」「デッキ下」と同系（色/角/太字） */
    .ds-btn{
      padding: 6px 10px; border-radius: 8px; border: 0;
      background: rgba(0,0,0,.6); color: #fff; font-weight: 700;
      font-size: 14px; line-height: 1; cursor: pointer;
    }

    /* カード一覧モーダル（DeckSelect > 見る） */
    #cardlist-backdrop { z-index: 10002; } /* 既存モーダルと同等の前面レイヤ */
    #preview-backdrop { z-index: 10003; }

    /* ===== ルーム設定モーダル ===== */
    .room-modal{
      width: min(720px, 92vw);
      height: auto;
      border: 1px solid #000;      /* 枠線（添付イメージ準拠） */
    }
    .room-form{ padding: 16px 20px 22px; }
    .room-row{ display: flex; align-items: center; gap: 24px; padding: 12px 4px; }
    .room-label{
      width: 110px; text-align: left; color:#333; font-weight:700; letter-spacing:.05em;
    }
    .room-field{ flex: 1; display:flex; align-items:center; gap: 26px; flex-wrap: wrap; }
    .room-radio{ display:flex; align-items:center; gap:8px; }
    .room-name-field{ gap: 12px; }
    .room-name-field input{
      width: 360px; max-width: 100%;
      padding: 8px 10px; border:1px solid #999; border-radius:4px; font-size:14px;
    }
    .room-error{ color:#e11; font-size:14px; }
    .req{ color:#e11; }
    .room-actions{ display:flex; justify-content:center; margin-top: 10px; }

    /* 「デッキ下」「裏向き」と同系の主ボタン */
    .btn-primary{
      padding: 10px 24px; border:0; border-radius:8px; cursor:pointer; font-weight:700;
      background: rgba(0,0,0,.8); color:#fff; font-size:16px; line-height:1;
    }

    /* ラジオの見た目をカスタム（外黒丸 + ONで中黒丸） */
    .room-radio { cursor: pointer; }

    .room-radio input[type="radio"]{
      appearance: none;
      -webkit-appearance: none;
      width: 20px;               /* ← 直径UP（お好みで 22～28px 程度に） */
      height: 20px;
      border: 2px solid #000;    /* 外側の黒丸（枠） */
      border-radius: 50%;
      display: inline-grid;
      place-content: center;
      background: #fff;          /* 内側は白 */
      margin: 0;                 /* ブラウザ既定の余白を消す */
    }

    .room-radio input[type="radio"]::before{
      content: "";
      width: 12px;               /* 中黒の直径（外径の約1/2が目安） */
      height: 12px;
      border-radius: 50%;
      background: #000;          /* 中黒 */
      transform: scale(0);       /* OFF時は非表示 */
      transition: transform 120ms ease-in-out;
    }

    .room-radio input[type="radio"]:checked::before{
      transform: scale(1);       /* ONで中黒を表示 */
    }

    /* キーボード操作時のフォーカスリング（見やすさ向上） */
    .room-radio input[type="radio"]:focus-visible{
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    /* 万一のフォールバック（appearance未対応時） */
    .room-radio input[type="radio"]{ accent-color: #000; }

    /* === Mobile: disable image callout & double-tap zoom (preserve pinch) === */
    html, body { touch-action: manipulation; }
    img { -webkit-touch-callout: none; }        /* iOSの長押しメニュー無効 */
    a, img, button, .card, .card * { -webkit-tap-highlight-color: rgba(0,0,0,0); }

    /* iOS: 長押しのコールアウト/ルーペを全体で無効化 */
    * { -webkit-touch-callout: none; }

    /* カスタムブロックの中央説明 */
    .deckselect-item.custom .custom-desc{
      flex: 1;
      text-align: left;   /* 左ぞろえに変更 */
      line-height: 1.6;
      font-size: 13px;
      font-weight: 700;
    }
    .deckselect-item.custom .custom-desc p{
      margin: 0;
    }

    /* === 画像プリロード中の全画面オーバーレイ === */
    #preload-overlay{
      position: fixed;
      inset: 0;
      display: none;                 /* 初期は非表示 */
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.6);    /* 薄い黒 */
      color: #fff;                   /* 白文字 */
      font-weight: 800;
      font-size: clamp(18px, 3.2vw, 32px);
      letter-spacing: .08em;
      z-index: 9998;
      pointer-events: auto;
    }

    /* ==== ドン増減モーダル ==== */
    .don-modal{ width: min(720px, 92vw); height: auto; }
    .don-box{
      border: none;
      padding: 16px;
      margin: 4px 6px 8px;
    }
    .don-grid{
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .donop-btn{
      padding: 6px 10px; border-radius: 8px; border: 0;
      color:#fff; font-weight:700; font-size:14px; line-height:1;
      cursor:pointer; user-select:none;
    }
    .donop-btn.plus  { background: rgba(255, 64,  64, .70); } /* 薄い赤 */
    .donop-btn.minus { background: rgba( 64, 160,255, .70); } /* 薄い青 */
    @media (max-width: 680px){
      .don-grid{ grid-template-columns: repeat(5, 1fr); }
    }

    /* ==== ドン増減：レスト調整トグル ==== */
    .don-toggle{
      position:absolute;
      left:8px; top:6px;
      display:flex; align-items:center; gap:10px;
      font-weight:700; color:#333;
    }
    .don-toggle .label{ white-space:nowrap; }
    .switch{
      position:relative; display:inline-block; width:46px; height:26px;
    }
    .switch input{ opacity:0; width:0; height:0; }
    .switch .slider{
      position:absolute; inset:0; border-radius:13px;
      background:#ddd; transition:background .2s;
    }
    .switch .slider::before{
      content:""; position:absolute; left:3px; top:3px;
      width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .switch input:checked + .slider{ background:#2ecc71; }
    .switch input:checked + .slider::before{ transform: translateX(20px); }
  </style>
</head>
<body>
  <!-- 背景動画 -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="component_images/wallpaper.mp4" type="video/mp4">
  </video>
  <div class="container">
    <!-- プレイヤーA -->
    <div class="player-field">
      <div class="card-grid">

        <div id="a-chara-1" class="card">CHARACTER</div>
        <div id="a-chara-2" class="card">CHARACTER</div>
        <div id="a-chara-3" class="card">CHARACTER</div>
        <div id="a-chara-4" class="card">CHARACTER</div>
        <div id="a-chara-5" class="card">CHARACTER</div>

        <!-- A-MENU -->
        <div class="card">
          <img src="component_images/menu.png" alt="A-MENU">
          <span class="menu-label">メニュー</span>

        <!-- A-LIFE -->
        <div class="card">
          <img id="a-life" src="component_images/life.png" alt="A-LIFE">

        <!-- A-LEADER -->
        <div class="card">
          <img id="a-leader-img" src="deck/player_A/leader.png" alt="A-LEADER">

        <!-- A-DON-REST -->

        <div class="card">

    <!-- プレイヤーB -->
    <div class="player-field">

        <div id="b-chara-2" class="card">CHARACTER</div>

          <span class="menu-label">メニュー</span>

        </div>

        <!-- B-LEADER -->
        <div class="card">
          <img id="b-leader-img" src="deck/player_B/leader.png" alt="B-LEADER">
          <span id="b-leader-don-label" class="don-label">ドン×0</span>
        </div>

        <!-- B-STAGE -->
        <div id="b-stage" class="card">STAGE</div>

        <!-- B-DECK -->
        <div class="card deck">
          <img id="b-deck" src="component_images/back.png" alt="B-DECK">
          <span id="b-deck-label" class="deck-label">デッキ×50</span>
        </div>

        <!-- B-DON-DECK -->
        <div class="card don-deck">
          <img src="component_images/don_back.png" alt="B-DON-DECK">
          <!-- ↓ 追加：中央アラート -->
          <img class="alert-icon" src="component_images/alert.png" alt="alert">
          <span id="b-don-deck-label" class="don-label">ドンデッキ×10</span>
        </div>

        <!-- B-DON-ACT -->
        <div class="card">
          <img src="component_images/don_act.png" alt="B-DON-ACT">
          <span id="b-don-act-label" class="don-label">アクティブ×0</span>

        <!-- B-DON-REST -->
        <div class="card">
          <img src="component_images/don_rest.png" alt="B-DON-REST">

          <img id="b-hand" src="component_images/hand.png" alt="B-HAND">
          <span id="b-hand-label" class="hand-label">手札×0</span>
        </div>

        <!-- B-TRASH -->

          <div id="b-trash-ph"></div>
          <img id="b-trash" alt="B-TRASH" style="display:none;">
          <span id="b-trash-label" class="trash-label">トラッシュ×0</span>

  </div>

  <!-- ===== モーダル（共通） ===== -->
  <div id="gallery-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <div id="gallery-label" class="modal-title"></div>
        <button id="gallery-reveal-all" type="button" class="header-btn" style="display:none;">すべて表向き</button>
      </div>

    </div>
  </div>

  <!-- ==== DECKメニュー（共通） ==== -->
  <div id="deck-menu" class="context-menu" role="menu" aria-hidden="true">
    <!-- デッキ右クリック時は「＋」表示（全角）。ライフ右クリック時はJSで元文言に戻す -->

    <button type="button" role="menuitem" data-action="life-plus">ライフ+</button>

  <!-- ==== ギャラリーサムネ共通メニュー ==== -->
  <div id="thumb-menu" class="context-menu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-action="to-hand">To：手札</button>

    <button type="button" role="menuitem" data-action="to-chara">To：キャラエリア</button>
    <button type="button" role="menuitem" data-action="to-deck-top">To：デッキ（上）</button>
    <button type="button" role="menuitem" data-action="to-deck-bottom">To：デッキ（下）</button>
    <button type="button" role="menuitem" data-action="to-life-top">To：ライフ（上）</button>
    <button type="button" role="menuitem" data-action="to-life-bottom">To：ライフ（下）</button>
    <button type="button" role="menuitem" data-action="to-stage">To：ステージエリア</button>
  </div>

  <!-- ==== リーダー／キャラ用 右クリックメニュー ==== -->
  <div id="piece-menu" class="context-menu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-action="rest">レスト</button>

    <button type="button" role="menuitem" data-action="move">移動する</button>

  <!-- リーダー／キャラ用のサブメニュー（中身はJSでthumb-menuを流用） -->
  <div id="piece-submenu" class="context-menu" role="menu" aria-hidden="true"></div>

  <!-- ==== メニュー（A-MENU / B-MENU）右クリック用 ==== -->
  <div id="main-menu" class="context-menu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-action="refresh">ターン開始</button>
    <button type="button" role="menuitem" data-action="mulligan">マリガン</button>
    <button type="button" role="menuitem" data-action="coin-toss">コイントス</button>
    <button type="button" role="menuitem" data-action="room-settings">ルーム設定</button>
    <button type="button" role="menuitem" data-action="deck-select">デッキ選択</button>
    <button type="button" role="menuitem" data-action="rules">ルール確認</button>

  <!-- ルール確認用PDFモーダル -->
  <div id="rules-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div id="rules-content" style="background:#fff; border-radius:10px; padding:8px; max-width:90vw; max-height:90vh; display:flex; align-items:center; justify-content:center;">

  <!-- デッキ選択モーダル -->
  <div id="deckselect-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div class="modal deckselect-modal">
      <div class="modal-header">
        <div class="modal-title">デッキ選択</div>
      </div>
      <div id="deckselect-list" class="deckselect-list" role="list"></div>

  <div id="cardlist-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">カード一覧</div>
        <!-- 閉じるボタンは置かない（外側クリック/Escで閉じる） -->

      <div id="cardlist-thumbs" class="thumbs" role="list"></div>

  <!-- ルーム設定モーダル -->
  <div id="room-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div class="modal room-modal" role="document">
      <div class="modal-header">
        <div class="modal-title">ルーム設定</div>
      </div>

      <form id="room-form" class="room-form" onsubmit="return false;">
        <!-- サイド -->
        <div id="room-side-row" class="room-row">
          <div class="room-label">サイド</div>
          <div class="room-field">
            <label class="room-radio"><input type="radio" name="side" value="A" checked> A</label>
            <label class="room-radio"><input type="radio" name="side" value="B"> B</label>
            <label class="room-radio"><input type="radio" name="side" value="C"> C（観戦/練習）</label>
          </div>
        </div>

        <!-- ルーム名 -->
        <div id="room-name-row" class="room-row">
          <div class="room-label"><span class="req">*</span>ルーム名</div>
          <div class="room-field room-name-field">
            <input id="room-name-input" type="text" placeholder="例：room01（半角英数のみ）" pattern="[0-9A-Za-z]+">
            <span id="room-name-error" class="room-error" style="display:none;">※入力必須です。</span>
          </div>

        <div class="room-actions">
          <button id="room-enter-btn" type="button" class="btn-primary">入室</button>
        </div>
      </form>
    </div>
  </div>

  <!-- プリロード中オーバーレイ -->
  <div id="preload-overlay" aria-hidden="true">画像データ読み込み中…</div>

  <!-- ドン増減モーダル -->
  <div id="don-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div class="modal don-modal">
      <div class="modal-header">
        <div id="don-modal-title" class="modal-title">ドン増減（現在：0枚）</div>
        <div id="rest-toggle-wrap" class="don-toggle" style="display:none;"><label class="switch"><input id="rest-toggle" type="checkbox"><span class="slider"></span></label><span class="label">レスト連動</span></div>
      </div>
      <div class="don-box">
        <div id="don-buttons" class="don-grid" role="group" aria-label="ドン増減ボタン"></div>
      </div>
    </div>
  </div>

  <!-- デッキ用の数値サブメニュー（1〜5） -->
  <div id="deck-submenu" class="context-menu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-n="1">1</button>
    <button type="button" role="menuitem" data-n="2">2</button>
    <button type="button" role="menuitem" data-n="3">3</button>
    <button type="button" role="menuitem" data-n="4">4</button>
    <button type="button" role="menuitem" data-n="5">5</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ROOM = new URLSearchParams(location.search).get('room') || 'dev';
    const withRoom = (url) => url + (url.includes('?') ? '&' : '?') +
                      'room=' + encodeURIComponent(ROOM);

    // 追加：このページロード共通のキャッシュバスター
    const __V = Date.now();

    /* ===== 画像スタック ===== */
    const deckImages = {
      A: Array.from({length:50}, (_,i) =>
        encodeURI(withRoom(`deck/player_A/images/image (${i+1}).png?v=${__V}`))),
      B: Array.from({length:50}, (_,i) =>
        encodeURI(withRoom(`deck/player_B/images/image (${i+1}).png?v=${__V}`))),
    };

    const handImages  = { A: [], B: [] };
    const lifeImages  = { A: [], B: [] };
    const trashImages = { A: [], B: [] };

    /* ===== カウント管理 ===== */
    let deckCounts   = { A: 50, B: 50 };
    let lifeCounts   = { A: 0,  B: 0 };
    let handCounts   = { A: 0,  B: 0 };
    let trashCounts  = { A: 0,  B: 0 };

    let donDeckCounts = { A: 10, B: 10 };
    let donActCounts  = { A: 0,  B: 0 };
    let donRestCounts = { A: 0,  B: 0 };

    // ★初回ターン開始のドン移動を済ませたか
    let FIRST_TURN_DON_BOOTSTRAP = false;

    renderCounts();

    // ★ リーダー画像もキャッシュ回避
    const aLeader = document.getElementById('a-leader-img');
    const bLeader = document.getElementById('b-leader-img');
    if (aLeader) aLeader.src = withRoom(`deck/player_A/leader.png?v=${__V}`);
    if (bLeader) bLeader.src = withRoom(`deck/player_B/leader.png?v=${__V}`);

    // ★起動時はalert.pngを非表示
    document.querySelectorAll('.card.don-deck .alert-icon').forEach(el => el.style.display = 'none');


    function renderCounts(){
      document.getElementById('a-deck-label').textContent  = `デッキ×${deckCounts.A}`;
      document.getElementById('b-deck-label').textContent  = `デッキ×${deckCounts.B}`;
      document.getElementById('a-life-label').textContent  = `ライフ×${lifeCounts.A}`;
      document.getElementById('b-life-label').textContent  = `ライフ×${lifeCounts.B}`;
      document.getElementById('a-hand-label').textContent  = `手札×${handCounts.A}`;
      document.getElementById('b-hand-label').textContent  = `手札×${handCounts.B}`;
      document.getElementById('a-trash-label').textContent = `トラッシュ×${trashCounts.A}`;
      document.getElementById('b-trash-label').textContent = `トラッシュ×${trashCounts.B}`;
      document.getElementById('a-don-deck-label').textContent = `ドンデッキ×${donDeckCounts.A}`;
      document.getElementById('b-don-deck-label').textContent = `ドンデッキ×${donDeckCounts.B}`;
      document.getElementById('a-don-act-label').textContent  = `アクティブ×${donActCounts.A}`;
      document.getElementById('b-don-act-label').textContent  = `アクティブ×${donActCounts.B}`;
      document.getElementById('a-don-rest-label').textContent = `レスト×${donRestCounts.A}`;
      document.getElementById('b-don-rest-label').textContent = `レスト×${donRestCounts.B}`;

      // ★ 手札/ライフの山アイコンは0枚のとき非表示
      const aHandImg = document.getElementById('a-hand');
      const bHandImg = document.getElementById('b-hand');
      const aLifeImg = document.getElementById('a-life');
      const bLifeImg = document.getElementById('b-life');
      const aDeckImg = document.getElementById('a-deck');
      const bDeckImg = document.getElementById('b-deck');
      if (aHandImg) aHandImg.style.display = (handCounts.A > 0) ? '' : 'none';
      if (bHandImg) bHandImg.style.display = (handCounts.B > 0) ? '' : 'none';
      if (aLifeImg) aLifeImg.style.display = (lifeCounts.A > 0) ? '' : 'none';
      if (bLifeImg) bLifeImg.style.display = (lifeCounts.B > 0) ? '' : 'none';
      if (aDeckImg) aDeckImg.style.display = (deckCounts.A > 0) ? '' : 'none';
      if (bDeckImg) bDeckImg.style.display = (deckCounts.B > 0) ? '' : 'none';

      // ★ ドン（デッキ／アクティブ／レスト）は0枚のとき画像を非表示
      const aDonDeckImg = document.querySelector('img[alt="A-DON-DECK"]');
      const bDonDeckImg = document.querySelector('img[alt="B-DON-DECK"]');
      const aDonActImg  = document.querySelector('img[alt="A-DON-ACT"]');
      const bDonActImg  = document.querySelector('img[alt="B-DON-ACT"]');
      const aDonRestImg = document.querySelector('img[alt="A-DON-REST"]');
      const bDonRestImg = document.querySelector('img[alt="B-DON-REST"]');
      if (aDonDeckImg) aDonDeckImg.style.display = (donDeckCounts.A > 0) ? '' : 'none';
      if (bDonDeckImg) bDonDeckImg.style.display = (donDeckCounts.B > 0) ? '' : 'none';
      if (aDonActImg)  aDonActImg.style.display  = (donActCounts.A  > 0) ? '' : 'none';
      if (bDonActImg)  bDonActImg.style.display  = (donActCounts.B  > 0) ? '' : 'none';
      if (aDonRestImg) aDonRestImg.style.display = (donRestCounts.A > 0) ? '' : 'none';
      if (bDonRestImg) bDonRestImg.style.display = (donRestCounts.B > 0) ? '' : 'none';
    }

    function setCount(type, player, n){
      if(type==="deck")      deckCounts[player]   = n;
      if(type==="life")      lifeCounts[player]   = n;
      if(type==="hand")      handCounts[player]   = n;
      if(type==="trash")     trashCounts[player]  = n;
      if(type==="donDeck")   donDeckCounts[player]= n;
      if(type==="donAct")    donActCounts[player] = n;
      if(type==="donRest")   donRestCounts[player]= n;
      renderCounts();
    }

    /* ===== ギャラリー（配列から表示） ===== */
    const backdrop = document.getElementById('gallery-backdrop');
    const thumbs   = document.getElementById('thumbs');

    function hideModal() {
      // ★デッキは閉じたら裏に戻す／ライフは保持
      const key = galleryKey();
      if (key && key.startsWith('deck-')) delete revealedFaces[key];

      backdrop.style.display = 'none';
      thumbs.innerHTML = '';
      backdrop.setAttribute('aria-hidden', 'true');

      // 任意：文脈をクリア（再オープン時に新規扱い）
      thumbsContext = { area: null, player: null };
    }
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) hideModal(); });

    // ★ どの一覧を開いているかの文脈（キャラ移動に必要）
    let thumbsContext = { area: null, player: null };

    const galleryLabel = document.getElementById('gallery-label');
    const revealAllBtn = document.getElementById('gallery-reveal-all');

    function openGalleryFromList(title, list){
      // ★ライフ/デッキのときだけ「すべて表向き」を表示
      const area = thumbsContext?.area;
      const player = thumbsContext?.player;
      const showReveal = (area === 'deck' || area === 'life');
      revealAllBtn.style.display = showReveal ? '' : 'none';
      revealAllBtn.onclick = null;

      if (showReveal){
        revealAllBtn.onclick = () => {
          const key = galleryKey();
          if (!key) return;
          // ★ ライフ一覧は同期アクションに切替（デッキは従来のローカルのまま）
          if (key.startsWith('life-')) {
            const player = thumbsContext?.player;
            emitAction({ type: 'LIFE_REVEAL_ALL', player });
            return; // 受信側でUI反映
          }
          // （デッキは従来処理）
          const kset = (revealedFaces[key] ||= new Set());
          kset.clear();
          if (key.startsWith('deck-')) {
            const player = thumbsContext?.player;
            const list = deckImages[player] || [];
            list.forEach(src => kset.add(src));

            // ▼ 全サムネを「表」にしつつ data-src を残す（原因①の解消）
            thumbs.querySelectorAll('.thumb-wrap').forEach(wrap => {
              const img = wrap.querySelector('img');
              if (!img) return;
              const real = img.dataset?.src;
              if (real) {
                img.src = real;                 // 表にする
                if (!img.dataset.src) img.dataset.src = real; // 念のため保持
              }

              // ▼ 「デッキ下」ボタンを未設置なら付与（原因②の解消）
              if (!wrap.querySelector('.thumb-deckbtn')) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'thumb-deckbtn';
                b.textContent = 'デッキ下';
                wrap.appendChild(b);
              }
            });
          }
        };
      }

      const labelMap = { hand: '手札', deck: 'デッキ', life: 'ライフ', trash: 'トラッシュ' };
      if (galleryLabel) {
        if (labelMap[area]) {
          // 手札だけ「現在のアクティブドン n枚」を付ける
          if (area === 'hand') {
            const n = (donActCounts?.[player] | 0);
            galleryLabel.textContent = `手札（アクティブドン×${n}枚）`;
          } else {
            galleryLabel.textContent = labelMap[area];
          }
          galleryLabel.parentElement.style.display = '';   // ヘッダーを表示
        } else {
          galleryLabel.textContent = '';
          galleryLabel.parentElement.style.display = 'none'; // 対象外は非表示
        }
      }

      // ラベル設定（既存）...
      thumbs.innerHTML = '';
      const isMasked = (thumbsContext?.area === 'deck' || thumbsContext?.area === 'life');
      const key = galleryKey();
      if (isMasked && key && !revealedFaces[key]) revealedFaces[key] = new Set();

      const frag = document.createDocumentFragment();
      const isLife = (thumbsContext?.area === 'life');
      const isDeck = (thumbsContext?.area === 'deck');

      list.forEach(src => {
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';

        const img = document.createElement('img');
        img.loading = 'lazy';          // ★遅延ロード
        img.decoding = 'async';        // ★非同期デコード
        img.dataset.src = src;         // 実画像は data-src に保持
        img.alt = '';

        // ★ ローディング表示：手札 / ライフ / トラッシュ は最初は back.png
        const area = thumbsContext?.area;              // 'hand' | 'life' | 'trash' | 'deck'
        const needLoader = (area === 'hand' || area === 'life' || area === 'trash');
        const isLifeRevealed = (area === 'life' && key && revealedFaces[key]?.has(src));
        const shouldShowFront = (area === 'hand' || area === 'trash' || isLifeRevealed);

        if (needLoader && shouldShowFront) {
          // まず背面を表示して「読み込み中」感を出す
          img.src = 'component_images/back.png';
          // 実画像をプリロードして、完了したら差し替え
          const pre = new Image();
          pre.onload = () => { img.src = img.dataset.src; };
          pre.src = src;
        } else {
          // ライフ未公開 or デッキの裏向きはそのまま back
          const showBack = (isMasked && key && !revealedFaces[key]?.has(src));
          img.src = showBack ? 'component_images/back.png' : src;
        }
        wrap.appendChild(img);

        // ★ライフで「表向き」＝revealed に入っているときだけボタン表示
        if (isLife && key && revealedFaces[key].has(src)) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb-flip';
          btn.textContent = '裏向き';
          wrap.appendChild(btn);
        }

        // ★デッキで表向きのとき「デッキ下」ボタン
        if (isDeck && key && revealedFaces[key].has(src)) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb-deckbtn';
          btn.textContent = 'デッキ下';
          wrap.appendChild(btn);
        }

        frag.appendChild(wrap);
      });

      thumbs.appendChild(frag);
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => forceScrollTop(thumbs));
    }

    // デッキ・手札・ライフ・トラッシュ：画像ではなく「セル(.card)」をクリックで一覧
    function wireAreaCell(imgSelector, area, player){
      const img  = document.querySelector(imgSelector);
      const card = img ? img.closest('.card') : null;
      if (!card) return;
      // 二重バインド防止（ハイフンの無い単一フラグに統一）
      if (card.dataset.bound === '1') return;
      card.dataset.bound = '1';
      card.addEventListener('click', () => {
        thumbsContext = { area, player };
        const listMap = { deck: deckImages, hand: handImages, life: lifeImages, trash: trashImages };
        const titleMap = { deck:'デッキ', hand:'手札', life:'ライフ', trash:'トラッシュ' };
        openGalleryFromList(`${player} ${titleMap[area]}`, listMap[area][player]);
      });
    }
    wireAreaCell('#a-deck',  'deck',  'A');
    wireAreaCell('#b-deck',  'deck',  'B');
    wireAreaCell('#a-hand',  'hand',  'A');
    wireAreaCell('#b-hand',  'hand',  'B');
    wireAreaCell('#a-life',  'life',  'A');
    wireAreaCell('#b-life',  'life',  'B');
    // トラッシュは img が display:none のときも要素自体はあるので同様にOK
    wireAreaCell('#a-trash', 'trash', 'A');
    wireAreaCell('#b-trash', 'trash', 'B');

    /* ===== デッキ → 手札（手札+1） ===== */
    function drawToHand(player){
      const stack = deckImages[player];
      if (!stack || stack.length === 0) return;
      const top = stack.shift();
      handImages[player].unshift(top); // ★先頭に積む

      deckCounts[player] = Math.max(0, deckCounts[player] - 1);
      handCounts[player] = (handCounts[player] || 0) + 1;
      renderCounts();
      // ★追加：モーダルが開いていれば両方更新
      refreshIfOpen('deck', player);
      refreshIfOpen('hand', player);
    }

    /* ===== デッキ → ライフ（ライフ+1） ===== */
    function drawToLife(player){
      const stack = deckImages[player];
      if (!stack || stack.length === 0) return;
      const top = stack.shift();
      lifeImages[player].push(top);

      deckCounts[player] = Math.max(0, deckCounts[player] - 1);
      lifeCounts[player] = (lifeCounts[player] || 0) + 1;
      renderCounts();
      refreshIfOpen('deck', player);
      refreshIfOpen('life', player);
    }

    // デッキ → ライフ（トップに積む版：ライフの先頭へ）
    function drawToLifeTop(player){
      const stack = deckImages[player];
      if (!stack || stack.length === 0) return;
      const top = stack.shift();
      lifeImages[player].unshift(top); // ★先頭に積む

      deckCounts[player] = Math.max(0, deckCounts[player] - 1);
      lifeCounts[player] = (lifeCounts[player] || 0) + 1;
      renderCounts();
      refreshIfOpen('deck', player);
      refreshIfOpen('life', player);
    }

    /* ===== デッキ → トラッシュ（トラッシュ+1） ===== */
    function moveTopToTrash(player){
      const stack = deckImages[player];

    // 汎用：配列から該当srcを1件だけ削除（URL正規化して一致判定）
    function normalizeSrc(s) {
      try {
        const u = new URL(String(s), location.origin);
        // クエリは捨て、デコードした pathname だけで比較（エンコード差/ホスト差/roomやvの違いを吸収）
        return decodeURIComponent(u.pathname.replace(/\\/g, '/'));
      } catch (_) {
        const noQuery = String(s).split('?')[0];
        try { return decodeURIComponent(noQuery); } catch { return noQuery; }
      }
    }
    function removeOne(list, src){
      const target = normalizeSrc(src);
      const i = list.findIndex(v => normalizeSrc(v) === target);
      if (i >= 0) list.splice(i, 1);
    }

    function shuffleInPlace(arr){
      for (let i = arr.length - 1; i > 0; i--) {

        [arr[i], arr[j]] = [arr[j], arr[i]];

      pieceMenu.dataset.player = ctx.player || '';

      pieceMenu.dataset.slot   = ctx.slot != null ? String(ctx.slot) : '';

      pieceMenu.style.display = 'block';
      pieceMenu.setAttribute('aria-hidden', 'false');

      // 位置（はみ出し防止）
      const w = pieceMenu.offsetWidth, h = pieceMenu.offsetHeight, pad = 8;
      let left = x, top = y;
      if (left + w + pad > window.innerWidth)  left = window.innerWidth  - w - pad;
      if (top  + h + pad > window.innerHeight) top  = window.innerHeight - h - pad;
      if (left < 8) left = 8;
      if (top  < 8) top  = 8;
      pieceMenu.style.left = `${left}px`;
      pieceMenu.style.top  = `${top}px`;

      const restBtn = pieceMenu.querySelector('button[data-action="rest"], button[data-action="active"]');
      if (restBtn){
        const player = pieceMenu.dataset.player;
        const area   = pieceMenu.dataset.area;
        const slot   = Number(pieceMenu.dataset.slot || 0);
        const cell   = getPieceCell(player, area, slot);
        const resting = isRest(cell);
        restBtn.dataset.action = resting ? 'active' : 'rest';
        restBtn.textContent    = resting ? 'アクティブ' : 'レスト';
      }
      const isStage = pieceMenu.dataset.area === 'stage';
      const donAdj = pieceMenu.querySelector('button[data-action="don-adjust"]');
      if (donAdj) donAdj.style.display = isStage ? 'none' : 'block';
      const moveBtn = pieceMenu.querySelector('button[data-action="move"]');
      if (moveBtn) moveBtn.style.display = (pieceMenu.dataset.area === 'leader') ? 'none' : 'block';
      wirePieceMoveHover();
    }
    function showPieceMenu(e, ctx = {}) {
      e.preventDefault();
      openPieceMenuAt(e.clientX, e.clientY, ctx);
    }

    function hidePieceMenu(){
      pieceMenu.style.display = 'none';
      pieceMenu.setAttribute('aria-hidden', 'true');

      delete pieceMenu.dataset.area;
      delete pieceMenu.dataset.slot;

      hidePieceSubMenu();

    // リーダー画像（A/B）右クリック
    document.querySelectorAll('#a-leader-img, #b-leader-img').forEach(img => {
      img.addEventListener('contextmenu', (e) => {
        const alt = img.alt || '';
        const player = alt.startsWith('A-') ? 'A' : alt.startsWith('B-') ? 'B' : '';
        showPieceMenu(e, { player, area: 'leader' });
      });
    });

    // キャラエリア画像 右クリック（動的生成対応）
    document.addEventListener('contextmenu', (e) => {
      const charaImg = e.target.closest(
        '#a-chara-1 img, #a-chara-2 img, #a-chara-3 img, #a-chara-4 img, #a-chara-5 img,' +
        '#b-chara-1 img, #b-chara-2 img, #b-chara-3 img, #b-chara-4 img, #b-chara-5 img'
      );

      const cell = charaImg.parentElement;

      const player = m[1].toUpperCase(); // 'A' | 'B'
      const slot   = parseInt(m[2], 10); // 1..5

    // 外側クリックで閉じる

    /* ==== piece-submenu：thumb-menuを流用 ==== */
    const pieceSubMenu = document.getElementById('piece-submenu');

    pieceSubMenu.innerHTML = document.getElementById('thumb-menu').innerHTML;

    // 置き換え：piece-submenu の表示位置を「右 → 右がはみ出すなら左」に自動切替
    function showPieceSubMenu(nextToBtn){
      const btnRect  = nextToBtn.getBoundingClientRect();
      const menuRect = pieceMenu.getBoundingClientRect();
      const pad = 8;

      pieceSubMenu.style.display = 'block';
      pieceSubMenu.setAttribute('aria-hidden','false');

      // ★サブメニューの表示制御：元エリアに応じて非表示
      const area = pieceMenu.dataset.area; // 'leader' | 'chara' | 'stage' | ...
      const toCharaBtn = pieceSubMenu.querySelector('button[data-action="to-chara"]');
      const toStageBtn = pieceSubMenu.querySelector('button[data-action="to-stage"]');

      // キャラ／ステージから開いたとき → To：キャラエリア／To：ステージエリア を隠す
      if (area === 'chara' || area === 'stage') {
        if (toCharaBtn) toCharaBtn.style.display = 'none';
        if (toStageBtn) toStageBtn.style.display = 'none';
      }
      // それ以外（リーダー等）は表示
      else {
        if (toCharaBtn) toCharaBtn.style.display = 'block';
        if (toStageBtn) toStageBtn.style.display = 'block';
      }

      const subW = pieceSubMenu.offsetWidth;
      const subH = pieceSubMenu.offsetHeight;

      // デフォルトは右側
      let left = menuRect.right + pad;
      let top  = btnRect.top;

      // 右側にはみ出すなら、左側へ反転
      if (left + subW + pad > window.innerWidth) {
        left = menuRect.left - pad - subW;
      }

      // 画面外対策（左右・上下のクランプ）
      if (left < 8) left = 8;
      if (top + subH + pad > window.innerHeight) top = Math.max(8, window.innerHeight - subH - pad);
      if (top < 8) top = 8;

      pieceSubMenu.style.left = `${left}px`;
      pieceSubMenu.style.top  = `${top}px`;

    function hidePieceSubMenu(){
      pieceSubMenu.style.display = 'none';
      pieceSubMenu.setAttribute('aria-hidden','true');

    // 「移動」以外の項目にホバーが移ったら、右側のサブメニューを閉じる
    pieceMenu.addEventListener('mouseover', (e) => {

    /* ホバーでの開閉（メニュー↔サブメニュー間の移動で閉じないように） */
    // 既存の overPiece / overSub を利用し、タイマーで遅延クローズ
    let overPiece = false, overSub = false;
    let subHideTimer = null;

    function clearSubTimer(){ if (subHideTimer) { clearTimeout(subHideTimer); subHideTimer = null; } }
    function scheduleHideMenus(){
      clearSubTimer();
      subHideTimer = setTimeout(() => {
        // どちらにもカーソルが無いときだけ閉じる
        if (!overPiece && !overSub) {
          hidePieceSubMenu();
          hidePieceMenu();
        }
      }, 200); // ← ブリッジ用の猶予（必要なら調整）
    }
    function scheduleHideSub(){
      clearSubTimer();
      subHideTimer = setTimeout(() => {
        // どちらにもカーソルが無いときだけサブメニューだけ閉じる
        if (!overPiece && !overSub) hidePieceSubMenu();
      }, 200); // 橋渡しの猶予（必要なら調整）
    }

    pieceMenu.addEventListener('mouseenter', () => { overPiece = true;  clearSubTimer(); });
    pieceMenu.addEventListener('mouseleave', () => { overPiece = false; scheduleHideSub(); });

    pieceSubMenu.addEventListener('mouseenter', () => { overSub = true;  clearSubTimer(); });
    pieceSubMenu.addEventListener('mouseleave', () => { overSub = false; scheduleHideSub(); });

    /* pieceMenuを開いた直後に「移動」ボタンのホバーでサブメニュー表示 */
    function wirePieceMoveHover(){
      const moveBtn = pieceMenu.querySelector('button[data-action="move"]');
      if (!moveBtn) return;
      moveBtn.addEventListener('mouseenter', () => showPieceSubMenu(moveBtn), { once:false });

    // 対象セルを取得（leader or chara slot）
    function getPieceCell(player, area, slot){
      if (area === 'leader'){
        const img = document.querySelector(`img[alt="${player}-LEADER"]`);
        return img?.parentElement || null;
      }
      if (area === 'chara'){
        return document.getElementById(`${player.toLowerCase()}-chara-${slot}`);
      }
      if (area === 'stage'){
        return document.getElementById(stageSlots[player]);
      }
      return null;
    }
    function isRest(cell){
      return !!cell?.querySelector('.rest-overlay');
    }
    function setRestState(cell, on){
      if (!cell) return;
      const ov = cell.querySelector('.rest-overlay');
      const bd = cell.querySelector('.rest-badge');
      if (on){
        if (!ov){
          const o = document.createElement('div');
          o.className = 'rest-overlay';
          cell.appendChild(o);
        }
        if (!bd){
          const b = document.createElement('span');
          b.className = 'rest-badge';
          b.textContent = 'レスト';
          cell.appendChild(b);
        }

        ov && ov.remove();

    pieceMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('button[role="menuitem"]');
      if (!btn) return;

      const action = btn.dataset.action;
      const player = pieceMenu.dataset.player;
      const area   = pieceMenu.dataset.area;
      const slot   = Number(pieceMenu.dataset.slot || 0);
      const cell   = getPieceCell(player, area, slot);
      if (!cell) return;

      if (action === 'rest' || action === 'active'){
        emitAction({ type:'PIECE_REST_SET', player, area, slot, on:(action==='rest') });
        hidePieceSubMenu(); hidePieceMenu();
        return;
      } else if (action === 'don-adjust'){
        // 右クリメニューを閉じてからドン増減モーダルを表示

        hidePieceMenu();

          openDonDialog(player, 'piece', { pieceArea: area, pieceSlot: slot }));
        return;
      }
    });

    // ドン×n ラベル取得/更新（なければ作る）
    function getDonLabelInCell(cell){
      return cell?.querySelector('.don-label') || null;
    }
    function getDonCount(cell){
      const lab = getDonLabelInCell(cell);
      const m = lab?.textContent.match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;
    }
    function setDonCount(cell, n){
      if (!cell) return;
      const clamped = Math.min(10, Math.max(0, Number(n) || 0));
      let lab = getDonLabelInCell(cell);
      if (!lab){
        lab = document.createElement('span');
        lab.className = 'don-label';
        cell.appendChild(lab);
      }
      lab.textContent = `ドン×${clamped}`;
    }

    document.getElementById('a-life').addEventListener('contextmenu', (e) => showDeckMenu(e, 'A', 'life'));
    document.getElementById('b-life').addEventListener('contextmenu', (e) => showDeckMenu(e, 'B', 'life'));

    function lifeToHand(player){
      const stack = lifeImages[player];
      if (!stack || stack.length === 0) return;
      const top = stack.shift();
      handImages[player].unshift(top); // ★先頭

      lifeCounts[player] = Math.max(0, lifeCounts[player] - 1);
      handCounts[player] = (handCounts[player] || 0) + 1;
      renderCounts();
      refreshIfOpen('life', player);
      refreshIfOpen('hand', player);
    }

    function lifeToTrash(player){
      const stack = lifeImages[player];
      if (!stack || stack.length === 0) return;
      const top = stack.shift();
      trashImages[player].unshift(top); // ★先頭

      lifeCounts[player]  = Math.max(0, lifeCounts[player] - 1);
      trashCounts[player] = (trashCounts[player] || 0) + 1;
      renderCounts();
      updateTrashFace(player);
      refreshIfOpen('life',  player);
      refreshIfOpen('trash', player);
    }

    // ===== STAGE（各陣営1枠） =====
    const stageImage = { A: null, B: null };
    const stageSlots = { A: 'a-stage', B: 'b-stage' };

    function placeInStage(player, src){
      const cell = document.getElementById(stageSlots[player]);
      if (!cell) return false;
      if (stageImage[player]) {
        const actor = window.__CURRENT_ACTOR;
        if (!actor || actor === myClientId()) alert('ステージエリアが埋まっています。');
        return false;
      }
      stageImage[player] = src;
      cell.innerHTML = '';
      const img = createImgWithBack(src, `${player}-STAGE`);
      img.addEventListener('click', () => openImagePreview(img.src, img.alt || ''));
      cell.appendChild(img);
      return true;
    }

    function removeFromArea(player, area, src){
      const list = areaLists[area]?.[player];
      if (Array.isArray(list)) removeOne(list, src);
      if (area === 'deck')  deckCounts[player]  = Math.max(0, deckCounts[player]  - 1);
      if (area === 'hand')  handCounts[player]  = Math.max(0, handCounts[player]  - 1);
      if (area === 'life')  lifeCounts[player]  = Math.max(0, lifeCounts[player]  - 1);
      if (area === 'trash') trashCounts[player] = Math.max(0, trashCounts[player] - 1);
      renderCounts();
      if (area === 'trash') updateTrashFace(player);
      // ★ライフから出たら、そのカードの表向きフラグをクリア
      if (area === 'life') {
        const key = `life-${player}`;
        revealedFaces[key]?.delete(src);
      }
    }

    function addToArea(player, area, src, pos='bottom'){
      const list = areaLists[area]?.[player];
      if (!Array.isArray(list)) return;

      if (area === 'deck'){
        if (pos === 'top') list.unshift(src); else list.push(src);
        deckCounts[player] = (deckCounts[player] || 0) + 1;
      } else if (area === 'life'){
        if (pos === 'top') list.unshift(src); else list.push(src);
        lifeCounts[player] = (lifeCounts[player] || 0) + 1;
      } else {
        // ★hand / trash は常に先頭へ
        list.unshift(src);
        if (area === 'hand')  handCounts[player]  = (handCounts[player]  || 0) + 1;
        if (area === 'trash') trashCounts[player] = (trashCounts[player] || 0) + 1;
      }
      renderCounts();
      if (area === 'trash') updateTrashFace(player);
    }
    function refreshIfOpen(area, player){
      if (backdrop.style.display !== 'flex') return;
      if (thumbsContext.player !== player || thumbsContext.area !== area) return;
      const titleMap = { deck:'デッキ', hand:'手札', life:'ライフ', trash:'トラッシュ' };
      openGalleryFromList(`${player} ${titleMap[area]}`, areaLists[area][player]);
    }
    /* 手札一覧モーダルを即座に開くユーティリティ */
    function openHandListNow(player){
      thumbsContext = { area: 'hand', player };
      openGalleryFromList(`${player} 手札`, handImages[player]);
    }

    // ★★ 差し替え版：サーバー同期で実行（送信のみ、ローカルは何もしない）
    pieceSubMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('button[role="menuitem"]');
      if (!btn) return;

      const action      = btn.dataset.action;
      const player      = pieceMenu.dataset.player;
      const fromArea    = pieceMenu.dataset.area;                 // 'leader' | 'chara' | 'stage'
      const fromSlot    = Number(pieceMenu.dataset.slot || 0);
      const cell        = getPieceCell(player, fromArea, fromSlot);
      const imgEl       = cell?.querySelector('img');
      if (!player || !cell || !imgEl) { hidePieceSubMenu(); return; }

      const src         = imgEl.getAttribute('src');

      // ★ステージ/リーダー/キャラ → リスト系 6種だけを同期アクションに委譲
      const toMap = {
        'to-hand'        : { to:'hand' },
        'to-trash'       : { to:'trash' },
        'to-life-top'    : { to:'life', pos:'top' },
        'to-life-bottom' : { to:'life', pos:'bottom' },
        'to-deck-top'    : { to:'deck', pos:'top' },
        'to-deck-bottom' : { to:'deck', pos:'bottom' },
      };

      const m = toMap[action];
      if (m) {
        emitAction({
          type     : 'PIECE_TO_LIST',
          player,
          fromArea,
          fromSlot,
          to       : m.to,
          pos      : m.pos || 'bottom',
          src
        });
        hidePieceSubMenu();
        hidePieceMenu();
        return;
      }

      // それ以外（To：ステージ／To：キャラエリア等）は従来どおりローカル処理
      if (action === 'to-stage') {
        // 置けない時は元へ戻す等、元のロジックを維持
        if (!placeInStage(player, src)) {
          if (fromArea === 'chara') {
            placeInChara(player, src);
          } else if (fromArea === 'leader') {
            const img = document.createElement('img');
            img.src = src; img.alt = `${player}-LEADER`;
            img.addEventListener('click', () => openImagePreview(img.src, img.alt || ''));
            cell.insertBefore(img, cell.firstChild);
          }
        }
      } else if (action === 'to-chara') {
        placeInChara(player, src);
      }

      hidePieceSubMenu();
      hidePieceMenu();
    });

    // ステージ画像 右クリック（動的生成対応）
    document.addEventListener('contextmenu', (e) => {
      const stageImg = e.target.closest('#a-stage img, #b-stage img');
      if (!stageImg) return;
      const cell = stageImg.closest('#a-stage, #b-stage');
      const player = cell.id.startsWith('a-') ? 'A' : 'B';
      showPieceMenu(e, { player, area: 'stage' }); // ★area=stage
    });

    /* ==== メニュー（A/BのMENUカード）右クリック用 ==== */
    const mainMenu = document.getElementById('main-menu');

    function showMainMenu(e, player){
      e.preventDefault();
      // 他メニューは閉じる
      if (typeof hideThumbMenu === 'function') hideThumbMenu();
      if (typeof hideDeckMenu  === 'function') hideDeckMenu();
      if (typeof hidePieceMenu === 'function') hidePieceMenu();
      if (typeof hidePieceSubMenu === 'function') hidePieceSubMenu();

      mainMenu.dataset.player = player || '';
      mainMenu.style.display = 'block';
      mainMenu.setAttribute('aria-hidden', 'false');

      // 位置（はみ出し防止）
      let x = e.clientX, y = e.clientY;
      const w = mainMenu.offsetWidth, h = mainMenu.offsetHeight, pad = 8;
      if (x + w + pad > window.innerWidth)  x = window.innerWidth  - w - pad;
      if (y + h + pad > window.innerHeight) y = window.innerHeight - h - pad;
      mainMenu.style.left = `${x}px`;
      mainMenu.style.top  = `${y}px`;
    }
    function hideMainMenu(){
      mainMenu.style.display = 'none';
      mainMenu.setAttribute('aria-hidden', 'true');
      delete mainMenu.dataset.player;
    }

    // MENU画像（A/B）右クリックで開く
    document.querySelectorAll('img[src$="menu.png"]').forEach(img => {
      img.addEventListener('contextmenu', (e) => {
        const alt = img.alt || '';
        const player = alt.startsWith('A-') ? 'A' : alt.startsWith('B-') ? 'B' : '';
        showMainMenu(e, player);
      });
    });

    // クリック処理：リフレッシュ/マリガン/ルール確認
    mainMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('button[role="menuitem"]');
      if (!btn) return;
      const action = btn.dataset.action;
      const player = mainMenu.dataset.player;

      if (action === 'deck-select') {
        DECK_SELECT_PLAYER = player || null;
        hideMainMenu();               // メニューを閉じる前に格納しておく
        requestAnimationFrame(openDeckSelect);
        return;
      }

      if (action === 'room-settings') {
        hideMainMenu();
        openRoomSettings();
        return;
      }

      if (action === 'refresh' && player) {
        hideMainMenu();
        requestAnimationFrame(() => {
          if (confirm('ターンを開始しますか？')) {
            emitAction({ type: 'REFRESH', player });
            // ターン開始後、手札一覧モーダルを表示（以降のドローは自動反映）
            requestAnimationFrame(() => openHandListNow(player));
          }
        })
      } else if (action === 'mulligan' && player) {
        hideMainMenu();
        requestAnimationFrame(() => {
          if (confirm('マリガンを行いますか？')) {
            const seed = (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0;
            emitAction({ type: 'MULLIGAN', player, seed });
            requestAnimationFrame(() => openHandListNow(player));
          }
        });
      } else if (action === 'rules') {
        hideMainMenu();           // 先に閉じてから
        requestAnimationFrame(openRules); // 次フレームでPDFモーダルを開く
      } else if (action === 'coin-toss') {          // ★ コイントス
        hideMainMenu();
        // 発火クライアントで一度だけ乱数 → 全員へ同結果を配信
        const result = (Math.random() < 0.5) ? 'heads' : 'tails'; // heads=オモテ, tails=ウラ
        emitAction({ type: 'COIN_TOSS', result });
      } else {
        hideMainMenu();
      }
    });

    // 外側クリック/スクロール/リサイズ/ESCで閉じる
    document.addEventListener('click', (e) => { if (!mainMenu.contains(e.target)) hideMainMenu(); });
    window.addEventListener('scroll', hideMainMenu, true);
    window.addEventListener('resize', hideMainMenu);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideMainMenu(); });

    // ★メニュー「リフレッシュ」：盤面を初期化（指定プレイヤーのみ）
    function refreshPlayer(player){
      // 1) リーダー／キャラのレスト解除
      const leaderCell = getPieceCell(player, 'leader');
      setRestState(leaderCell, false);
      setDonCount(leaderCell, 0);

      // 1-a) ステージのレスト解除 ★追加
      const stageCell = getPieceCell(player, 'stage');
      setRestState(stageCell, false);

      for (let i = 1; i <= 5; i++){
        const cell = getPieceCell(player, 'chara', i);
        if (!cell) continue;
        setRestState(cell, false);
        // 2) キャラのドン×n を 0に（カードがあるセルのみ）
        if (cell.querySelector('img')) setDonCount(cell, 0);
      }

      // 3) ドンレスト を 0 に
      donRestCounts[player] = 0;

      // 4) ドンアクティブ = 10 - (ドンデッキ)
      const deckN = Number(donDeckCounts[player]) || 0;
      donActCounts[player] = Math.max(0, Math.min(10, 10 - deckN));

      renderCounts();

      // ▼ 既存のリフレッシュ処理が完了した後の追加処理
      // ・ドンデッキ×n に -2（残が少ない場合はあるだけ）
      // ・アクティブ×n に +2（上限10、ドンデッキから動かした分だけ加算）
      {
        const move = Math.min(2, donDeckCounts[player]);         // 実際に動かせる数
        donDeckCounts[player] = Math.max(0, donDeckCounts[player] - move);
        donActCounts[player]  = Math.min(10, donActCounts[player] + move);
      }

      // ・デッキの一番上のカードを手札へ
      drawToHand(player);  // ※内部で deck/hand のカウント更新と renderCounts() を実行

      updateDonDeckAlert(player);
    }

    // ★マリガン：手札をすべてデッキに戻してシャッフル→上から5枚引く
    function mulliganPlayer(player){
      const deck = deckImages[player];
      const hand = handImages[player];

      // 手札→デッキ（戻す順は不問：この後シャッフル）
      if (hand.length > 0) {
        deck.push(...hand);
        hand.length = 0;
      }
      // カウンタ一旦反映
      deckCounts[player] = deck.length;
      handCounts[player] = 0;

      // デッキをシャッフル
      shuffleInPlace(deck);

      // 上から5枚（残枚数が少なければ取れるだけ）を手札へ
      const drawN = Math.min(5, deck.length);
      for (let i = 0; i < drawN; i++) {
        hand.unshift(deck.shift()); // ★先頭に積む
      }

      // カウンタ反映
      deckCounts[player] = deck.length;
      handCounts[player] = hand.length;
      renderCounts();

      // 一覧を開いていたら更新

    // シード付きRNG（Mulberry32）
    function rngMulberry32(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
    // シード付きシャッフル
    function shuffleWithSeed(arr, seed){
      const rand = rngMulberry32(seed >>> 0);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function applyListMove(a){
      const { player, from, to, pos='bottom', src } = a || {};
      if (!player || !from || !to || !src) return;

      if (to === 'chara') {
        if (!placeInChara(player, src)) return;
        removeFromArea(player, from, src);
        refreshIfOpen(from, player);
        // ★追加：一覧に入ってきた側（to）が開かれていたら即時再描画
        refreshIfOpen(to,   player);
        return;
      }
      if (to === 'stage') {
        if (!placeInStage(player, src)) return;
        removeFromArea(player, from, src);
        refreshIfOpen(from, player);
        // ★追加
        refreshIfOpen(to,   player);
        return;
      }

      removeFromArea(player, from, src);
      addToArea(player, to, src, pos);
      // ★追加：from と to の両方をケア
      refreshIfOpen(from, player);
      refreshIfOpen(to,   player);
    }

    // ★★ 受信適用：ステージ/リーダー/キャラ → リスト(手札/トラッシュ/ライフ/デッキ)
    function applyPieceToList(a){
      const { player, fromArea, fromSlot=0, to, pos='bottom', src } = a || {};
      if (!player || !fromArea || !to || !src) return;

      // 1) 送り元セルの処理
      const cell = getPieceCell(player, fromArea, fromSlot);
      const imgEl = cell?.querySelector('img');

      if (fromArea === 'chara') {
        // ★追加：キャラの「ドン×n」をドンレストに加算（上限10）
        const add = (typeof getDonCount === 'function') ? (getDonCount(cell) || 0) : 0;
        if (add > 0) {
          const curr = Number(donRestCounts[player]) || 0;
          donRestCounts[player] = Math.min(10, curr + add);
          if (typeof renderCounts === 'function') renderCounts();
        }

        // スロット配列の実体も空に
        const m = cell?.id?.match(/^([ab])-chara-(\d)$/i);
        if (m) { const idx = parseInt(m[2], 10) - 1; charaImages[player][idx] = null; }
        if (cell) cell.innerHTML = 'CHARACTER';
      } else if (fromArea === 'leader') {
        if (imgEl) imgEl.remove(); // ラベル(ドン×n等)は残す
      } else if (fromArea === 'stage') {
        // ステージの占有を明示的に解除（空なのに「埋まっています」対策）
        stageImage[player] = null;
        if (cell) cell.innerHTML = `${player}-STAGE`;
      }

      // 2) 受け側リストへ投入（内部でカウント/UI更新まで完結）
      addToArea(player, to, src, pos);
      refreshIfOpen(to, player); // 一覧を開いている場合は即時反映
    }

    function myClientId(){
      if (!window.__CLIENT_ID) {

      }

    }

    // ★★★ ライフ表向き同期 受信適用 ★★★
    function applyLifeRevealAll(a){
      const player = a?.player; if (!player) return;
      const key = `life-${player}`;
      const list = lifeImages[player] || [];
      revealedFaces[key] = new Set(list);      // 全部表
      if (thumbsContext?.area === 'life' && thumbsContext?.player === player) {
        refreshIfOpen('life', player);
      }
    }

    function applyLifeRevealOne(a){
      const { player, src } = a || {};
      if (!player || !src) return;
      const key = `life-${player}`;
      (revealedFaces[key] ||= new Set()).add(src);
      if (thumbsContext?.area === 'life' && thumbsContext?.player === player) {
        refreshIfOpen('life', player);
      }
    }

    function applyLifeHideOne(a){
      const { player, src } = a || {};
      if (!player || !src) return;
      const key = `life-${player}`;
      revealedFaces[key]?.delete(src);
      if (thumbsContext?.area === 'life' && thumbsContext?.player === player) {
        refreshIfOpen('life', player);
      }
    }

    // ★★ 受信適用：マリガン（手札→デッキ→シード付きシャッフル→5枚ドロー）
    function applyMulligan(a){
      const player = a?.player;
      const seed   = (a?.seed >>> 0) || 0;
      if (!player) return;
      const deck = deckImages[player];
      const hand = handImages[player];
      if (!Array.isArray(deck) || !Array.isArray(hand)) return;
      if (hand.length > 0) { deck.push(...hand); hand.length = 0; }
      deckCounts[player] = deck.length; handCounts[player] = 0;
      if (typeof shuffleWithSeed === 'function') shuffleWithSeed(deck, seed);
      const drawN = Math.min(5, deck.length);
      for (let i = 0; i < drawN; i++) hand.unshift(deck.shift());
      deckCounts[player] = deck.length; handCounts[player] = hand.length;
      renderCounts(); refreshIfOpen('deck', player); refreshIfOpen('hand', player);
    }

    // ★追加：ドン整合チェック & アラート表示/非表示
    function updateDonDeckAlert(player){
      const deck = Number(donDeckCounts[player]) || 0;
      const act  = Number(donActCounts[player])  || 0;
      const rest = Number(donRestCounts[player]) || 0;

      // 場のドン＝リーダー＋キャラ5枠の合計
      let field = 0;
      const leaderCell = getPieceCell(player, 'leader');
      field += getDonCount(leaderCell);
      for (let i = 1; i <= 5; i++){
        field += getDonCount(getPieceCell(player, 'chara', i));
      }

      const ok = (10 - deck) === (act + rest + field);

      const labId   = `${player.toLowerCase()}-don-deck-label`;
      const labEl   = document.getElementById(labId);
      const cardEl  = labEl ? labEl.closest('.don-deck') : null;
      const alertEl = cardEl ? cardEl.querySelector('.alert-icon') : null;
      if (alertEl) alertEl.style.display = ok ? 'none' : '';
    }

    /* ===== デッキ選択モーダル ===== */
    // 動的に deck_built 配下のフォルダ名を取得（API→静的JSONの順にフォールバック）
    let deckBuiltFolders = [];
    let deckFoldersLoaded = false;

    async function fetchDeckBuiltFolders(){
      if (deckFoldersLoaded) return deckBuiltFolders;

      // 1) API（後述の /api/deckbuilt）
      try{
        const r = await fetch('/api/deckbuilt', { cache:'no-store' });
        if (r.ok){
          const j = await r.json();
          deckBuiltFolders = Array.isArray(j) ? j : (j.folders || []);
          deckFoldersLoaded = true;
          return deckBuiltFolders;
        }
      }catch(_){}

      // 2) 静的JSON（public/deck_built/_list.json）
      try{
        const r2 = await fetch('deck_built/_list.json', { cache:'no-store' });
        if (r2.ok){
          const j2 = await r2.json();
          deckBuiltFolders = Array.isArray(j2) ? j2 : (j2.folders || []);
          deckFoldersLoaded = true;
          return deckBuiltFolders;
        }
      }catch(_){}

      deckBuiltFolders = [];
      deckFoldersLoaded = true;
      return deckBuiltFolders;
    }

    let DECK_SELECT_PLAYER = null; // 'A' または 'B'

    const deckSelBackdrop = document.getElementById('deckselect-backdrop');
    const deckSelList     = document.getElementById('deckselect-list');

    // ★カスタムアップロード（フォルダ） → 即時適用
    async function handleCustomUpload(fileList, btn){
      if (!DECK_SELECT_PLAYER) { alert('プレイヤーが特定できません'); return; }
      const player = DECK_SELECT_PLAYER;
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'アップロード中…';
      try{
        const raw = Array.from(fileList || []);
        if (raw.length === 0) throw new Error('ファイルが選択されていません');

        // webkitRelativePathからトップフォルダ名を除去し、'leader.png'と'images/'配下だけ許可
        const top = (raw[0].webkitRelativePath || '').split('/')[0] || '';
        const accepted = [];
        let hasLeader = false, imgCount = 0;
        for (const f of raw){
          let rel = (f.webkitRelativePath || f.name).replace(/\\/g,'/');
          if (top && rel.startsWith(top + '/')) rel = rel.slice(top.length + 1);
          const low = rel.toLowerCase();
          if (low === 'leader.png'){
            hasLeader = true; accepted.push({ rel: 'leader.png', file: f });
          } else if (low.startsWith('images/')){
            imgCount++; accepted.push({ rel, file: f });
          }
        }
        if (!hasLeader) throw new Error('leader.png が見つかりません（フォルダ直下に配置してください）');
        if (imgCount === 0) throw new Error('images フォルダ内のファイルが見つかりません');

        // Base64化してまとめて送信
        const toBase64 = (file) => new Promise((res, rej) => {
          const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || '');
          r.onerror = rej; r.readAsDataURL(file);
        });
        const filesPayload = [];
        for (const {rel, file} of accepted){
          filesPayload.push({ path: rel, contentBase64: await toBase64(file) });
        }

        const r = await fetch('/api/deck/upload-and-apply?room=' + encodeURIComponent(ROOM), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player, files: filesPayload })
        });
        const j = await r.json().catch(()=>({ ok:false }));
        if (!r.ok || !j.ok) throw new Error(j.error || r.statusText);

        // ← 既存の「選択」適用と同じUI更新（リーダー/50枚/ラベル/同期/モーダル閉じ）
        const v = Date.now();
        const base = (player === 'A') ? 'deck/player_A' : 'deck/player_B';
        const leaderEl = document.getElementById(player === 'A' ? 'a-leader-img' : 'b-leader-img');
        if (leaderEl) leaderEl.src = withRoom(`${base}/leader.png?v=${v}`);
        const imgs = Array.from({ length: 50 }, (_, i) => withRoom(`${base}/images/image (${i+1}).png?v=${v}`));
        deckImages[player] = imgs;
        deckCounts[player] = imgs.length;
        renderCounts();
        refreshIfOpen('deck', player);
        closeDeckSelect();
        emitAction({ type: 'DECK_APPLIED', player, v });
        btn.textContent = '適用しました';
      } catch(e){
        alert('アップロードに失敗：' + (e && e.message || e));
        btn.textContent = orig;
      } finally {
        btn.disabled = false;
      }
    }

    function renderDeckSelectList(){
      // ローディング表示
      deckSelList.innerHTML = '<div style="grid-column:1/-1;padding:12px;">読み込み中…</div>';

      fetchDeckBuiltFolders().then(list => {
        deckSelList.innerHTML = '';

        // ★最上段：カスタム（全幅・右隣にブロックが来ない）
        {
          const item = document.createElement('div');
          item.className = 'deckselect-item custom';
          // item.style.gridColumn = '1 / -1'; // ← フル幅
          paintCustomBg(item); // ★6色ストライプ背景

          const nm = document.createElement('div');
          nm.className = 'deckselect-name';
          nm.textContent = 'カスタム';

          // ★中央の説明文
          const desc = document.createElement('div');
          desc.className = 'custom-desc';
          const line1 = document.createElement('p');
          const line2 = document.createElement('p');
          desc.append(line1, line2);

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ds-btn';
          btn.textContent = 'アップロード';

          const input = document.createElement('input');
          input.type = 'file';
          input.setAttribute('webkitdirectory','');
          input.setAttribute('multiple','');
          input.style.display = 'none';

          btn.addEventListener('click', () => input.click());
          input.addEventListener('change', () => {
            if (input.files && input.files.length) handleCustomUpload(input.files, btn);
            input.value = ''; // 次回も同じフォルダを選べるように
          });

          item.append(nm, desc, btn, input);
          deckSelList.appendChild(item);
        }

        if (!list || list.length === 0){
          deckSelList.innerHTML = '<div style="grid-column:1/-1;padding:12px;">デッキが見つかりません</div>';
          return;
        }

        const frag = document.createDocumentFragment();
        list.forEach(name => {
          const item = document.createElement('div');
          item.className = 'deckselect-item';

          paintDeckBg(item, name); // ★ 先頭2文字の色で背景を塗る

          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = `deck_built/${encodeURIComponent(name)}/leader.png`; // 例: /deck_built/黒イム/leader.png
          img.alt = name;

          const nm  = document.createElement('div');
          nm.className = 'deckselect-name';
          nm.textContent = name; // フォルダ名そのまま表示

          const btnSee = document.createElement('button');
          btnSee.type = 'button';
          btnSee.className = 'ds-btn';
          btnSee.textContent = '見る';
          btnSee.addEventListener('click', () => { openCardListModal(name); });

          const btnPick = document.createElement('button');
          btnPick.type = 'button';
          btnPick.className = 'ds-btn';
          btnPick.textContent = '選択';

          btnPick.addEventListener('click', async () => {
            if (!DECK_SELECT_PLAYER) { alert('プレイヤーが特定できません'); return; }
            btnPick.disabled = true;
            const orig = btnPick.textContent;
            btnPick.textContent = '適用中…';
            try {
              const r = await fetch('/api/deck/apply?room='+encodeURIComponent(ROOM), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player: DECK_SELECT_PLAYER, folder: name })
              });
              const j = await r.json().catch(()=>({ ok:false, error:'invalid response' }));
              if (r.ok && j.ok) {
                // --- 自動リロード廃止：同期で全員に反映 ---
                const player = DECK_SELECT_PLAYER;
                const v = Date.now(); // キャッシュバスター
                const base = (player === 'A') ? 'deck/player_A' : 'deck/player_B';

                // 1) ローカルUI更新（リーダー画像）
                const leaderEl = document.getElementById(player === 'A' ? 'a-leader-img' : 'b-leader-img');
                if (leaderEl) leaderEl.src = withRoom(`${base}/leader.png?v=${v}`);

                // 2) ローカルUI更新（デッキ50枚の配列を差し替え）
                const imgs = Array.from({ length: 50 }, (_, i) => withRoom(`${base}/images/image (${i+1}).png?v=${v}`));
                deckImages[player] = imgs;     // 既存の deckImages を上書き
                deckCounts[player] = imgs.length; // カウントも50にリセット
                renderCounts();                   // ラベル更新
                refreshIfOpen('deck', player);    // デッキ一覧を開いていれば即時反映

                // 3) モーダルを閉じる
                closeDeckSelect();

                // 4) 全クライアントへ同期アクション送信
                emitAction({ type: 'DECK_APPLIED', player, v });

                // ボタン状態だけ穏当に戻す
                btnPick.textContent = '適用しました';
                btnPick.disabled = false;
              } else {
                alert('適用に失敗：' + (j.error || r.statusText));
                btnPick.disabled = false; btnPick.textContent = orig;
              }
            } catch (e) {
              alert('適用に失敗：' + e);
              btnPick.disabled = false; btnPick.textContent = orig;
            }
          });

          item.append(img, nm, btnSee, btnPick);
          frag.appendChild(item);
        });
        deckSelList.appendChild(frag);
        forceScrollTop(deckSelList);
      }).catch(() => {
        deckSelList.innerHTML = '<div style="grid-column:1/-1;padding:12px;">読み込みに失敗しました</div>';
      });
    }

    function openDeckSelect(){
      renderDeckSelectList();                      // ← 非同期で一覧を埋める
      deckSelBackdrop.style.display = 'flex';
      deckSelBackdrop.setAttribute('aria-hidden', 'false');

    function closeDeckSelect(){
      deckSelBackdrop.style.display = 'none';
      deckSelBackdrop.setAttribute('aria-hidden', 'true');
      deckSelList.innerHTML = '';
    }
    deckSelBackdrop.addEventListener('click', (e) => { if (e.target === deckSelBackdrop) closeDeckSelect(); });

    // === デッキ名→色 ===
    const COLOR_RGB = {
      '赤': '255, 64,  64',   // red
      '緑': '64,  200, 120',  // green
      '青': '64,  180, 255',  // blue
      '紫': '160, 80,  200',  // purple
      '黒': '34,  34,  34',   // black-ish
      '黄': '255, 210, 0'     // yellow
    };

    // …既存 COLOR_RGB / paintDeckBg の下あたりに追記
    function paintCustomBg(el){
      // 左から: 赤, 青, 緑, 紫, 黒, 黄
      const cols = [
        '255, 64,  64',   // 赤
        '64,  180, 255',  // 青
        '64,  200, 120',  // 緑
        '160, 80,  200',  // 紫
        '34,  34,  34',   // 黒
        '255, 210, 0'     // 黄
      ];
      const a = 0.65;
      const stops = cols.map((c,i) => {
        const p0 = Math.round(i * 100 / cols.length);
        const p1 = Math.round((i+1) * 100 / cols.length);
        return `rgba(${c}, ${a}) ${p0}% ${p1}%`;
      }).join(', ');
      el.style.background = `linear-gradient(135deg, ${stops})`;
    }

    // 先頭2文字から色を最大2つ取り出す
    function pickColorsFromName(name){
      const chars = Array.from(name).slice(0, 2);
      return chars.map(ch => COLOR_RGB[ch]).filter(Boolean);
    }

    // 背景を塗る（1色=単色、2色=斜めグラデ）
    function paintDeckBg(el, deckName){
      const cols = pickColorsFromName(deckName);
      const a = 0.65; // 透過（文字を読みやすく）
      if (cols.length >= 2){
        el.style.background = `linear-gradient(135deg,
          rgba(${cols[0]}, ${a}) 0 50%,
          rgba(${cols[1]}, ${a}) 50% 100%)`;
      } else if (cols.length === 1){
        el.style.background = `rgba(${cols[0]}, ${a})`;
      } else {
        el.style.background = 'rgba(255,255,255,0.9)'; // フォールバック
      }
    }

    /* ==== DeckSelect > 見る：カード一覧モーダル ==== */
    const cardListBackdrop = document.getElementById('cardlist-backdrop');
    const cardListThumbs   = document.getElementById('cardlist-thumbs');

    function buildCardListPaths(folder){
      // フォルダは未エンコードで組んでから、セグメント単位で1回だけエンコード
      const base = encodeURI(`deck_built/${folder}`);

      const list = [
        `${base}/leader.png`,
        ...Array.from({ length: 50 }, (_, i) =>
          `${base}/images/${encodeURIComponent(`image (${i + 1}).png`)}`
        ),
      ];
      // ここで追加の encodeURI は不要（= 二重エンコードを避ける）
      return list;
    }

    function openCardListModal(folder){
      cardListThumbs.innerHTML = '';
      const frag = document.createDocumentFragment();
      buildCardListPaths(folder).forEach(src => {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.dataset.src = src;            // 実画像パスは data-src に保持
        img.src = 'component_images/back.png'; // ★まずは背面画像でローディング感
        img.alt = folder;

        // 実画像をプリロードして、読み込み完了後に差し替え
        const real = new Image();
        real.decoding = 'async';

   // === 起動時にルーム設定モーダルを開く ===

    /* === Mobile: long-press => contextmenu, and disable double-tap zoom === */
    (() => {
      const isTouchCapable = matchMedia("(pointer: coarse)").matches || 'ontouchstart' in window;

      // 長押しで既存の右クリック処理を発火させる対象
      const TARGET_SELECTOR = [
        '#thumbs img', '#a-deck', '#b-deck', '#a-life', '#b-life',
        '#a-leader-img', '#b-leader-img',
        '#a-chara-1 img','#a-chara-2 img','#a-chara-3 img','#a-chara-4 img','#a-chara-5 img',
        '#b-chara-1 img','#b-chara-2 img','#b-chara-3 img','#b-chara-4 img','#b-chara-5 img',
        '#a-stage img', '#b-stage img', 'img[src$="menu.png"]'
      ].join(', ');

      if (isTouchCapable) {
        let tId, sx, sy;
        const clear = () => { if (tId) clearTimeout(tId); tId = null; };

        document.addEventListener('pointerdown', e => {
          if (e.pointerType === 'mouse') return;
          const el = e.target.closest(TARGET_SELECTOR);
          if (!el) return;
          sx = e.clientX; sy = e.clientY;
          clear();
          tId = setTimeout(() => {
            el.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, cancelable:true, clientX:sx, clientY:sy}));
          }, 550);
        }, {passive:true});

        document.addEventListener('pointermove', e => {
          if (!tId) return;
          if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clear();
        }, {passive:true});

        ['pointerup','pointercancel','pointerleave'].forEach(type =>
          document.addEventListener(type, clear, {passive:true})
        );

        // ブラウザ既定の長押しメニューを抑止（アプリ側のメニューだけ出す）
        document.addEventListener('contextmenu', e => {
          if (e.target.closest(TARGET_SELECTOR)) e.preventDefault();
        }, true);
      }

      // ダブルタップ拡大の抑止（ピンチは可）
      document.addEventListener('dblclick', e => { if (isTouchCapable) e.preventDefault(); }, {passive:false, capture:true});
      let last = 0, lx = 0, ly = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now(), t = e.changedTouches && e.changedTouches[0];
        const dx = Math.abs((t?.clientX||0) - lx), dy = Math.abs((t?.clientY||0) - ly);
        if (now - last < 350 && dx < 30 && dy < 30) e.preventDefault();
        last = now; lx = t?.clientX||0; ly = t?.clientY||0;
      }, {passive:false, capture:true});
    })();

    /* iOS対策：意図しないテキスト選択を即クリアしてルーペ出現を防止 */
    (function(){
      const clearSelection = () => {
        const sel = window.getSelection && window.getSelection();
        if (!sel) return;
        // 入力系は除外（将来フォームを置く可能性に配慮）
        const a = document.activeElement;
        const keep =
          a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
        if (keep) return;
        if (sel.rangeCount) sel.removeAllRanges();
      };
      // テキスト選択の発火を検知したらクリア
      document.addEventListener('selectionchange', clearSelection, true);
      // 長押し・ドラッグ中も随時クリア（軽量・パッシブ）

    // 本体画像の読み込みが終わるまで back.png を表示する img を返す
