    // ==== デッキ画像プリロード（A/B 計100枚）＋オーバーレイ制御 ====
    let __preloadToken = 0;
    function preloadImages(urls, { concurrency = 8 } = {}) {
      return new Promise((resolve) => {
        let i = 0, done = 0;
        const total = urls.length;
        function kick(){
          if (i >= total) return;
          const src = urls[i++];
          const img = new Image();
          const fin = () => { if (++done === total) resolve(); else kick(); };
          img.onload = fin; img.onerror = fin; img.decoding = 'async';
          img.src = src;
        }
        const n = Math.min(concurrency, total);
        for (let k=0; k<n; k++) kick();
      });
    }
    function showPreloadOverlay(text='画像データ読み込み中…'){
      const el = document.getElementById('preload-overlay');
      if (!el) return;
      el.textContent = text;
      el.style.display = 'flex';
      el.setAttribute('aria-hidden','false');
    }
    function hidePreloadOverlay(){
      const el = document.getElementById('preload-overlay');
      if (!el) return;
      el.style.display = 'none';
      el.setAttribute('aria-hidden','true');
    }
    async function runDeckPreload({ showOverlay=false } = {}){
      const token = ++__preloadToken;
      if (showOverlay) showPreloadOverlay();
      try{
        const urls = [...(deckImages?.A||[]), ...(deckImages?.B||[])];
        await preloadImages(urls, { concurrency: 8 });
      } finally {
        if (token === __preloadToken && showOverlay) hidePreloadOverlay();
      }
    }

    // 画面初期表示：オーバーレイでプリロード→完了で自動的に消す
    window.addEventListener('load', () => {
      const schedule = ('requestIdleCallback' in window)
        ? (cb) => window.requestIdleCallback(cb, { timeout: 1200 })
        : (cb) => setTimeout(cb, 0);
      schedule(() => runDeckPreload({ showOverlay: true }));
    });

    /* ===== ドン増減（ドンデッキ／アクティブ／レスト） ===== */
    const donBackdrop  = document.getElementById('don-backdrop');
    const donTitleEl   = document.getElementById('don-modal-title');
    const donBtnsWrap  = document.getElementById('don-buttons');

    const restTglWrap  = document.getElementById('rest-toggle-wrap');
    const restTglInput = document.getElementById('rest-toggle');

    // scope: 'donDeck'|'donAct'|'donRest'|'piece'
    let   donCtx       = { player:null, scope:null, pieceArea:null, pieceSlot:0 };
    let   restAdjustOn = false;                       // 「レスト調整」トグル状態（デフォルトOFF）

    const tableByScope = {
      donDeck: () => donDeckCounts,
      donAct : () => donActCounts,
      donRest: () => donRestCounts,
    };
    function getDonValue(player, scope){
      const t = tableByScope[scope]?.(); return Number(t?.[player]) || 0;
    }
    function setDonTitle(){
      if (!donCtx.player) return;
      let n = 0;
      if (donCtx.scope === 'piece'){
        const cell = getPieceCell(donCtx.player, donCtx.pieceArea, donCtx.pieceSlot);
        n = getDonCount(cell);
      } else if (donCtx.scope) {
        n = getDonValue(donCtx.player, donCtx.scope);
      }
      donTitleEl.textContent = `ドン増減（現在：${n}枚）`;
    }
    function openDonDialog(player, scope, opts = {}){
      donCtx = { player, scope, pieceArea: opts.pieceArea || null, pieceSlot: (opts.pieceSlot|0) || 0 };
      // 連動トグルの表示制御（アクティブ/レストで表示、デフォルトOFF）
      if (restTglWrap) {
        const show = (scope === 'donAct' || scope === 'donRest');
        restTglWrap.style.display = show ? '' : 'none';
        // スコープに応じてラベルを切替
        const lbl = restTglWrap.querySelector('.label');
        if (lbl) {
          lbl.textContent = (scope === 'donRest') ? 'アクティブ連動' : 'レスト連動';
        }
        if (restTglInput) restTglInput.checked = false;
        restAdjustOn = false;
      }
      // ボタンを20個生成（+1..+10 → -1..-10）
      donBtnsWrap.innerHTML = '';
      for (let i=1;i<=10;i++){
        const b = document.createElement('button');
        b.type='button'; b.className='donop-btn plus'; b.dataset.delta=String(i);
        b.textContent = `+${i}`; donBtnsWrap.appendChild(b);
      }
      for (let i=1;i<=10;i++){
        const b = document.createElement('button');
        b.type='button'; b.className='donop-btn minus'; b.dataset.delta=String(-i);
        b.textContent = `-${i}`; donBtnsWrap.appendChild(b);

      donBackdrop.style.display='flex';
      donBackdrop.setAttribute('aria-hidden','false');

    if (restTglInput) restTglInput.addEventListener('change', () => { restAdjustOn = !!restTglInput.checked; });

    function closeDonDialog(){
      donBackdrop.style.display='none';
      donBackdrop.setAttribute('aria-hidden','true');
      donCtx = { player:null, scope:null };
    }
    donBackdrop.addEventListener('click', (e)=>{ if (e.target === donBackdrop) closeDonDialog(); });
    donBtnsWrap.addEventListener('click', (e)=>{
      const btn = e.target.closest('button.donop-btn'); if (!btn) return;
      const delta = parseInt(btn.dataset.delta, 10) || 0;

      const { player, scope, pieceArea, pieceSlot } = donCtx; if (!player) return;

      if (scope === 'piece'){
        const cell = getPieceCell(player, pieceArea, pieceSlot);
        const curr = getDonCount(cell);
        const next = Math.min(10, Math.max(0, curr + delta));
        if (typeof emitAction === 'function'){
          emitAction({ type:'PIECE_DON_SET', player, area: pieceArea, slot: pieceSlot, value: next });
        }
        // モーダルを閉じてから、カード画像中心に右クリメニューを再表示
        const imgEl = cell?.querySelector('img');
        let cx = null, cy = null;
        if (imgEl){
          const r = imgEl.getBoundingClientRect();
          cx = Math.round(r.left + r.width / 2);
          cy = Math.round(r.top  + r.height / 2);
        }
        closeDonDialog();
        if (cx != null && cy != null && typeof openPieceMenuAt === 'function') {
          // 同フレームだとクリックイベントのバブリングで閉じられるので次フレームで開く
          requestAnimationFrame(() => openPieceMenuAt(cx, cy, { player, area: pieceArea, slot: pieceSlot }));
        }
        return;
      }

      // ← ここからはドンデッキ/アクティブ/レスト用（既存どおり）
      const curr = getDonValue(player, scope);
      const next = Math.min(10, Math.max(0, curr + delta));
      const eff  = next - curr; // 実際に反映される増減（クランプ考慮）
      if (typeof emitAction === 'function'){
        emitAction({ type:'DON_SET', scope, player, value: next });
        if (scope === 'donAct' && restAdjustOn && eff !== 0) {
          const rCurr = getDonValue(player, 'donRest');
          const rNext = Math.min(10, Math.max(0, rCurr - eff)); // +なら減、-なら増
          if (rNext !== rCurr) emitAction({ type:'DON_SET', scope:'donRest', player, value: rNext });
        }
        // レスト→アクティブ連動（新規）
        else if (scope === 'donRest' && restAdjustOn && eff !== 0) {
          const aCurr = getDonValue(player, 'donAct');
          const aNext = Math.min(10, Math.max(0, aCurr - eff)); // +なら減、-なら増

        }

      closeDonDialog();

    // 盤面のドンカードを左クリックでモーダルオープン

    wireDon('img[alt="A-DON-DECK"]', 'A', 'donDeck');
    wireDon('img[alt="B-DON-DECK"]', 'B', 'donDeck');
    wireDon('img[alt="A-DON-ACT"]' , 'A', 'donAct');
    wireDon('img[alt="B-DON-ACT"]' , 'B', 'donAct');
    wireDon('img[alt="A-DON-REST"]', 'A', 'donRest');
    wireDon('img[alt="B-DON-REST"]', 'B', 'donRest');



    // ====== socketの処理 ======



    // ====== 1) 接続（room/name/role=spec で観戦入室） ======
    const qs   = new URLSearchParams(location.search);
    const room = qs.get('room') || 'dev';
    const name = qs.get('name') || `guest-${Math.floor(Math.random()*1000)}`;
    const socket = io({ query: { room, name } });

    let MY_SEAT = 'P1';

    // === 受信：同室からのリロード要求 → 自動で再読み込み（ループ防止フラグ付き） ===
    socket.on('room:reload', () => {
      try { sessionStorage.setItem('MD_ReloadByBroadcast', '1'); } catch (_) {}
      location.reload();
    });

    // === 接続時：このページのロードが「リロード」だったら他クライアントへ通知 ===
    socket.on('connect', () => {
      let isReload = false;
      try {
        const navs = performance.getEntriesByType && performance.getEntriesByType('navigation');
        if (navs && navs.length) {
          isReload = (navs[0].type === 'reload');
        } else if (performance && performance.navigation) {
          // 古いブラウザ向けフォールバック
          isReload = (performance.navigation.type === 1);
        }
      } catch (_) {}

      let byBroadcast = false;
      try { byBroadcast = (sessionStorage.getItem('MD_ReloadByBroadcast') === '1'); } catch (_) {}

      // 自分が手動リロードしたときだけ通知（ブロードキャストでのリロードは再通知しない）
      if (isReload && !byBroadcast) socket.emit('client:request-room-reload');
      // 一度使ったフラグはクリア
      if (byBroadcast) { try { sessionStorage.removeItem('MD_ReloadByBroadcast'); } catch (_) {} }
    });

    // room:hello で MY_ROLE / MY_SEAT が入る箇所の直後に追加
    function myPlayerLetter(){
      return (MY_SEAT === 'P1') ? 'A' : 'B';

    socket.on('room:hello', ({ role, seat }) => {

    // ====== 2) 受信アクション → 既存関数に適用 ======
    socket.on('action', (a) => {
      const __prevActor = window.__CURRENT_ACTOR;
      window.__CURRENT_ACTOR = a?.actor || null;

      switch (a.type) {
        case 'REFRESH': {
          // ★初回だけ：押下プレイヤーのドンデッキ-1 / アクティブ+1 のみ実行して他はスキップ
          if (!FIRST_TURN_DON_BOOTSTRAP) {
            FIRST_TURN_DON_BOOTSTRAP = true;
            const p = a.player;

            const deckNext = Math.max(0, (Number(donDeckCounts[p]) || 0) - 1);
            const actNext  = Math.min(10, (Number(donActCounts[p])  || 0) + 1);

            if (typeof setCount === 'function') {
              setCount('donDeck', p, deckNext);

            }

            break; // ★初回はここで終了（＝他のリフレッシュ処理は行わない）
          }

          // ★2回目以降は従来どおり
          if (typeof setActiveTurnUI === 'function') setActiveTurnUI(a.player);
          if (typeof clearNoAttackIcons === 'function') clearNoAttackIcons(a.player);
          if (typeof refreshPlayer   === 'function') refreshPlayer(a.player);

          // ★通常ターン開始時も、手札モーダルを開いていればタイトルを更新
          if (backdrop?.style.display === 'flex'
              && thumbsContext?.area === 'hand'
              && thumbsContext?.player === a.player
              && galleryLabel) {
            galleryLabel.textContent = `手札（アクティブドン×${(donActCounts?.[a.player] | 0)}枚）`;
          }

          break;
        }
        case 'DECK_TO_HAND':       if (typeof drawToHand          === 'function') drawToHand(a.player); break;
        case 'DECK_TO_LIFE_TOP':   if (typeof drawToLifeTop       === 'function') drawToLifeTop(a.player); break;
        case 'DECK_TO_TRASH':      if (typeof moveTopToTrash      === 'function') moveTopToTrash(a.player); break;
        case 'DECK_SHUFFLE':       if (typeof shuffleWithSeed     === 'function') shuffleWithSeed(deckImages[a.player], a.seed ?? 0); break;
        case 'LIFE_TO_HAND':       if (typeof lifeToHand          === 'function') lifeToHand(a.player); break;
        case 'LIFE_TO_TRASH':      if (typeof lifeToTrash         === 'function') lifeToTrash(a.player); break;
        case 'LIFE_SHUFFLE':       if (typeof shuffleWithSeed     === 'function') shuffleWithSeed(lifeImages[a.player], a.seed ?? 0); break;
        case 'PIECE_REST_SET':     if (typeof setRestState        === 'function') setRestState(getPieceCell(a.player, a.area, a.slot), !!a.on); break;
        case 'PIECE_DON_SET': {
          if (typeof setDonCount === 'function') {
            setDonCount(getPieceCell(a.player, a.area, a.slot), a.value|0);

          // ★追加：場のドンが変わるので毎回更新
          updateDonDeckAlert(a.player);
          break;
        }
        case 'LIST_MOVE':          if (typeof applyListMove       === 'function') applyListMove(a); break;
        case 'PIECE_TO_LIST':      if (typeof applyPieceToList    === 'function') applyPieceToList(a); break;
        case 'LIFE_REVEAL_ALL':    if (typeof applyLifeRevealAll  === 'function') applyLifeRevealAll(a); break;
        case 'LIFE_REVEAL_ONE':    if (typeof applyLifeRevealOne  === 'function') applyLifeRevealOne(a); break;
        case 'LIFE_HIDE_ONE':      if (typeof applyLifeHideOne    === 'function') applyLifeHideOne(a); break;
        case 'MULLIGAN':        if (typeof applyMulligan === 'function') applyMulligan(a); break;
        case 'COIN_TOSS': {

          alert(isHeads ? 'オモテ！' : 'ウラ！');
          break;

        case 'DECK_APPLIED': {
          const player = a?.player;

          const v = a?.v || Date.now();
          const base = (player === 'A') ? 'deck/player_A' : 'deck/player_B';

          // リーダー画像の差し替え（キャッシュバスター付）
          const leaderEl = document.getElementById(player === 'A' ? 'a-leader-img' : 'b-leader-img');
          if (leaderEl) leaderEl.src = withRoom(`${base}/leader.png?v=${v}`);

          // デッキ50枚を差し替え（配列とカウント）
          const imgs = Array.from({ length: 50 }, (_, i) => withRoom(`${base}/images/image (${i+1}).png?v=${v}`));
          deckImages[player]  = imgs;
          deckCounts[player]  = imgs.length;
          renderCounts();
          refreshIfOpen('deck', player);

          // ★A/B 合計100枚を裏でプリロード（完了までオーバーレイ表示）
          if (typeof runDeckPreload === 'function') runDeckPreload({ showOverlay: true });

          break;
        }
        case 'DON_SET': {
          // ドン3種（donDeck / donAct / donRest）の絶対値セット
          const scope  = a.scope;
          const player = a.player;
          const value  = Math.min(10, Math.max(0, (a.value|0)));
          if (scope === 'donDeck' || scope === 'donAct' || scope === 'donRest'){
            if (typeof setCount === 'function') setCount(scope, player, value);
            if (typeof updateDonDeckAlert === 'function') updateDonDeckAlert(player);
            // モーダルを開いている場合はタイトルの現在枚数も更新
            setDonTitle();
            // ★手札一覧を表示中で、該当プレイヤーならタイトルを同期更新
            if (scope === 'donAct'
                && backdrop?.style.display === 'flex'
                && thumbsContext?.area === 'hand'
                && thumbsContext?.player === player
                && galleryLabel) {
              const n = (donActCounts?.[player] | 0);
              galleryLabel.textContent = `手札（アクティブドン×${n}枚）`;
            }
          }
          break;
        }
      }

      window.__CURRENT_ACTOR = __prevActor;
    });

    // ====== 3) 送信APIの提供 ======
    if (!window.emitAction) {
      window.emitAction = function(action) {
        action.actor = myClientId();
        socket.emit('action', action);
      };
    }

    // 任意：盤面スナップショットの送出
    if (!window.pushSnapshot) {
      window.pushSnapshot = function(state) {
        socket.emit('snapshot:push', state);
      };
    }
  </script>
</body>
</html>
